---
version: "3"

includes:
  stack:
    taskfile: ./.taskfile/Taskfile.stack.yml
  cf:
    taskfile: ./.taskfile/Taskfile.cf.yml

tasks:
  default:
    desc: "列出 infra stacks"
    summary: |
      task tf
      task tf TAG=cloudflare
    cmds:
      - task: stack:list
        vars:
          TAG: "{{.TAG}}"

  validate:
    desc: "对单个 infra stack 做本地校验"
    summary: |
      task tf:validate STACK=infra/stacks/homelab/cloudflare/lucc.dev/dns
      task tf:validate STACK=infra/stacks/homelab/cloudflare/account/d1
    cmds:
      - task: stack:validate
        vars:
          STACK: "{{.STACK}}"

  plan:
    desc: "对单个 stack 或一组 tagged stacks 做计划预览"
    summary: |
      task tf:plan STACK=infra/stacks/homelab/cloudflare/account/d1
      task tf:plan TAG=cloudflare
    cmds:
      - task: stack:plan
        vars:
          STACK: "{{.STACK}}"
          TAG: "{{.TAG}}"

  apply:
    desc: "对单个 infra stack 执行 apply"
    summary: |
      task tf:apply STACK=infra/stacks/homelab/cloudflare/account/d1
    cmds:
      - task: stack:apply
        vars:
          STACK: "{{.STACK}}"

  state-rm:
    desc: "从单个 infra stack 的 remote state 中移除指定资源地址"
    summary: |
      task tf:state-rm STACK=infra/stacks/homelab/cloudflare/lucc.dev/dns ADDRESS='cloudflare_dns_record.records["bc"]'
    cmds:
      - task: stack:state-rm
        vars:
          STACK: "{{.STACK}}"
          ADDRESS: "{{.ADDRESS}}"

  inventory:
    desc: "拉取 Cloudflare live inventory"
    summary: |
      task tf:inventory
      task tf:inventory DATE=2026-03-27
    cmds:
      - task: cf:inventory
        vars:
          DATE: "{{.DATE}}"

  terranix:
    desc: "生成所有 terranix stack 的 Terraform JSON"
    summary: |
      task tf:terranix
    dir: "{{.TASKFILE_DIR}}/.."
    cmds:
      - |
        set -euo pipefail
        nix develop .#infra --command bash -c '
          set -euo pipefail
          for src in $(find infra/stacks -name terranix.nix | sort); do
            out=$(dirname "$src")/generated.tf.json
            echo "==> $src"
            tmp=$(mktemp "$out.XXXXXX")
            trap "rm -f \"$tmp\"" EXIT
            terranix --with-nulls "$src" | jq -S . > "$tmp"
            mv "$tmp" "$out"
            trap - EXIT
          done
        '

  check:
    desc: "本地校验 infra（terranix freshness + actionlint + fmt/validate）"
    summary: |
      nix develop .#infra
      task tf:check
    dir: "{{.TASKFILE_DIR}}/.."
    cmds:
      - |
        set -euo pipefail
        nix develop .#infra --command bash -c '
          set -euo pipefail
          for src in $(find infra/stacks -name terranix.nix | sort); do
            out=$(dirname "$src")/generated.tf.json
            echo "==> $src"
            terranix --with-nulls "$src" | jq -S . | diff -u "$out" -
          done
        '
      - actionlint .github/workflows/infra.yml
      - |
        set -euo pipefail
        for d in $(terramate list --tags layer-infra); do
          echo "==> $d"
          (cd "$d" && tofu init -backend=false -input=false -no-color >/dev/null && tofu fmt -check && tofu validate -no-color)
        done
