---
version: "3"

includes:
  stack:
    taskfile: ./.taskfile/Taskfile.stack.yml
  cf:
    taskfile: ./.taskfile/Taskfile.cf.yml

vars:
  # terranix 试点 stack；生成与 freshness 校验共用，避免路径在多处重复。
  DNS_STACK: infra/stacks/homelab/cloudflare/lucc.dev/dns
  TAILSCALE_STACK: infra/stacks/homelab/tailscale/tailnet

tasks:
  default:
    desc: "列出 infra stacks"
    summary: |
      task tf
      task tf TAG=cloudflare
    cmds:
      - task: stack:list
        vars:
          TAG: "{{.TAG}}"

  validate:
    desc: "对单个 infra stack 做本地校验"
    summary: |
      task tf:validate STACK=infra/stacks/homelab/cloudflare/lucc.dev/dns
      task tf:validate STACK=infra/stacks/homelab/cloudflare/account/pages
    cmds:
      - task: stack:validate
        vars:
          STACK: "{{.STACK}}"

  plan:
    desc: "对单个 stack 或一组 tagged stacks 做计划预览"
    summary: |
      task tf:plan STACK=infra/stacks/homelab/cloudflare/account/pages
      task tf:plan TAG=cloudflare
    cmds:
      - task: stack:plan
        vars:
          STACK: "{{.STACK}}"
          TAG: "{{.TAG}}"

  apply:
    desc: "对单个 infra stack 执行 apply"
    summary: |
      task tf:apply STACK=infra/stacks/homelab/cloudflare/account/pages
    cmds:
      - task: stack:apply
        vars:
          STACK: "{{.STACK}}"

  state-rm:
    desc: "从单个 infra stack 的 remote state 中移除指定资源地址"
    summary: |
      task tf:state-rm STACK=infra/stacks/homelab/cloudflare/lucc.dev/dns ADDRESS='cloudflare_dns_record.records["bc"]'
    cmds:
      - task: stack:state-rm
        vars:
          STACK: "{{.STACK}}"
          ADDRESS: "{{.ADDRESS}}"

  inventory:
    desc: "拉取 Cloudflare live inventory"
    summary: |
      task tf:inventory
      task tf:inventory DATE=2026-03-27
    cmds:
      - task: cf:inventory
        vars:
          DATE: "{{.DATE}}"

  dns:generate:
    desc: "从 fleet metadata 生成 DERP DNS records 文件"
    summary: |
      task tf:dns:generate
    cmds:
      - task: cf:dns:generate

  dns:check:
    desc: "检查 DERP DNS records 文件是否与 fleet metadata 同步"
    summary: |
      task tf:dns:check
    cmds:
      - task: cf:dns:check

  facts:
    desc: "从 Nix 生成共享 infra facts"
    summary: |
      task tf:facts
    dir: "{{.TASKFILE_DIR}}/.."
    cmds:
      # 先写临时文件再 mv：nix eval / terranix 失败时不要把已提交的生成物截断。
      - |
        set -euo pipefail
        mkdir -p infra/generated
        tmp="$(mktemp infra/generated/.facts.json.XXXXXX)"
        trap 'rm -f "$tmp"' EXIT
        nix eval --json .#infraFacts | jq -S . > "$tmp"
        mv "$tmp" infra/generated/facts.json

  terranix-gen:
    internal: true
    dir: "{{.TASKFILE_DIR}}/.."
    requires:
      vars:
        - SRC
        - OUT
    cmds:
      - |
        set -euo pipefail
        tmp="$(mktemp "{{.OUT}}.XXXXXX")"
        trap 'rm -f "$tmp"' EXIT
        nix develop .#infra --command bash -c 'set -o pipefail; terranix --with-nulls {{.SRC}} | jq -S .' > "$tmp"
        mv "$tmp" "{{.OUT}}"

  terranix-diff:
    internal: true
    dir: "{{.TASKFILE_DIR}}/.."
    requires:
      vars:
        - SRC
        - OUT
    cmds:
      - |
        set -euo pipefail
        terranix --with-nulls {{.SRC}} | jq -S . | diff -u "{{.OUT}}" -

  terranix:
    desc: "生成 DNS stack 的 Terraform JSON（terranix 试点）"
    summary: |
      task tf:terranix
    cmds:
      - task: terranix-gen
        vars:
          SRC: "{{.DNS_STACK}}/terranix.nix"
          OUT: "{{.DNS_STACK}}/generated.tf.json"

  terranix-tailscale:
    desc: "生成 Tailscale stack 的 Terraform JSON（terranix 第二个试点）"
    summary: |
      task tf:terranix-tailscale
    cmds:
      - task: terranix-gen
        vars:
          SRC: "{{.TAILSCALE_STACK}}/terranix.nix"
          OUT: "{{.TAILSCALE_STACK}}/generated.tf.json"

  check:
    desc: "本地校验 infra（dns/facts/terranix freshness + actionlint + fmt/validate）"
    summary: |
      nix develop .#infra
      task tf:check
    dir: "{{.TASKFILE_DIR}}/.."
    cmds:
      - task: cf:dns:check
      - |
        set -euo pipefail
        nix eval --json .#infraFacts | jq -S . | diff -u infra/generated/facts.json -
      - task: terranix-diff
        vars:
          SRC: "{{.DNS_STACK}}/terranix.nix"
          OUT: "{{.DNS_STACK}}/generated.tf.json"
      - task: terranix-diff
        vars:
          SRC: "{{.TAILSCALE_STACK}}/terranix.nix"
          OUT: "{{.TAILSCALE_STACK}}/generated.tf.json"
      - actionlint .github/workflows/infra.yml
      - |
        set -euo pipefail
        for d in $(terramate list --tags layer-infra); do
          echo "==> $d"
          (cd "$d" && tofu init -backend=false -input=false -no-color >/dev/null && tofu fmt -check && tofu validate -no-color)
        done
