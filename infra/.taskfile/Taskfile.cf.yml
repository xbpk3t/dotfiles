---
version: "3"


tasks:
  inventory:
    desc: "拉取 Cloudflare live inventory"
    summary: |
      task tf:inventory
      task tf:cf:inventory DATE=2026-03-27
    dir: "{{.USER_WORKING_DIR}}/infra"
    preconditions:
      - sh: test -n "${CLOUDFLARE_API_TOKEN:-}"
        msg: "必须先提供 CLOUDFLARE_API_TOKEN"
      - sh: test -n "${CF_ACCOUNT_ID:-}"
        msg: "必须先提供 CF_ACCOUNT_ID"
      - sh: test -n "${CF_ZONE_ID:-}"
        msg: "必须先提供 CF_ZONE_ID"
    env:
      CF_API_TOKEN: "{{.CLOUDFLARE_API_TOKEN}}"
      CF_ACCOUNT_ID: "{{.CF_ACCOUNT_ID}}"
      CF_ZONE_ID: "{{.CF_ZONE_ID}}"
    cmds:
      - nu .taskfile/cloudflare-inventory.nu {{.DATE}}
