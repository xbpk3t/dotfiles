---
frontmatter:
  role: atom
  desc: 用 herdr-core 的 hc 把任务 publish 给其他 agent（claude/codex 等）；只派发不回收

what:
  is: |
    当本会话决定把子任务委派给 herdr-core 中另一个 agent 时，用 hc 完成
    选模板/启动 agent/确认发布 的委派流程，确认已发布。
  not: |
    不是旧 herdr TUI 的 pane/agent 命令（TUI 已移除）。
    不是自动化脚本/调度框架；不负责回收/回读子 agent 的最终结果。

gate:
  - qs: 目标机器/终端是否可达？
    fail: 先 `hc machine ls` 确认机器已添加；远程 agent 用 `--on <machine>` 启动，终端地址记为 `<machine>/<t>`。

workflow:
  - phase: 选择模板
    steps:
      - "先看 `hc templates`；有 reviewer/simplifier/implementer 等现成角色就优先用；没有就启动普通交互式 agent。"
  - phase: 委派（publish）
    steps:
      - 确认子任务有明确交付物、可独立执行；给每个 agent 一个唯一 `--name` 和精确 scope。
      - "启动：`hc run --bg --name <name> --cwd <dir> [--on <machine>] <template> '<任务>'`；无模板时用 `hc run --bg --name <name> --cwd <dir> [--on <machine>] <agent> '<任务>'`。"
      - "agent 必须用 `--bg` 启动；不要用无 `--bg` 的 `hc run`，否则整个屏幕会流进当前输出。"
      - "确认发布：`hc get <t>` 看 `first_message.sent`；若为 false，先 `hc read <t>` 处理 trust dialog/readiness，再 `hc send <t> '<任务>'`，不要盲目重发。"
      - "句柄用终端地址 `<t>`（远程形如 `machine/t7`）；把它记进交付信息。"
      - "失败先 `hc get <t>` / `hc read <t>` 查状态，再定向处理，不整链盲试。"
constraint:
  must:
    - "实际执行 hc CLI，不要只把委派意图 echo 出来。"
  must-not:
    - "不要回收/等待最终结果；需要时另行 `hc wait <t>` / `hc read <t>`。"
    - "不要再用 `herdr pane/agent/workspace` 旧命令（TUI 已移除）。"

output:
  format: md
  struct:
    - key: 委派确认
      val: agent/template + 任务摘要 + 终端地址（`t7` 或 `machine/t7`）

self-check:
  - 实际执行了 hc（非字面转述）？
  - 用了 `--bg`，并确认 `first_message.sent`？
  - 没有越界去 read/回收最终结果？

hint:
  - if: first_message.sent=false
    then: 先 `hc read <t>` 看屏幕；处理 readiness 后用 `hc send`，不要盲目重发。
  - if: 之后需要子 agent 的产出
    then: 另行 `hc wait <t>` / `hc read <t>`；本 prpt 只管 publish。
  - if: 需要完整命令面
    then: 读 `hc --skill`（herdr-core 官方 manual），不要套用旧 herdr TUI 命令。
