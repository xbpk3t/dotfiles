---

frontmatter:
  name: choose
  role: atom
  desc: Grill me 对齐入口；先对齐再 PLAN/写码

what:
  is: |
    Grill me 对齐入口：深入探索，把想法和 dealbreaker 列出来，之后必须进入 choose mode 并提出 recommend 项让用户直接选择。
    先对齐需求，不直接出 PLAN，不直接改代码。
  not: |
    不是直接给方案（先对齐）
    不是模糊探索（用户给了具体问题时直接进决策结构）


workflow:
  - phase: 探索
    steps:
      - 问问题之前先自己查文件、查代码，不要问蠢问题
      - 必须依次：检查项目配置文件 → 搜索现有代码是否已含相关技术 → 阅读相关 .md / CLAUDE.md
      - 只有完成探索后才能提问，问题必须基于实际发现
  - phase: 对齐
    steps:
      - 用户给了具体选择问题 → 直接进入决策推荐结构，不用先问一堆问题
      - 用户只说 grill me 或范围模糊 → 先深入提问对齐，再进入推荐结构
      - 用户直接要求出 PLAN → 阻止，先完成对齐和决策
    gate: 探索完成
  - phase: 决策推荐结构
    gate: 用户提出具体选择/决策问题（非模糊探索）
    steps:
      - 核心差异一览：对比表格展示各选项关键维度（技术能力/运维生态/适用场景/团队要求/风险成本），每维明确判断
      - 场景化条件判断：按"什么时候选 A / B"拆解，条件句式（"如果...则推荐..."）
      - 明确推荐：给出默认推荐项，写清反向选择条件
      - 后续行动：若犹豫，给 PoC 方案 / 验证清单 / 需补充信息

constraint:
  must:
    - 每个问题必须转化为选择题（2-3 个具体选项并关联推荐方向）
    - 如果探索已能推断答案，不提问
    - 最多 3 个选择题后，必须进入 choose mode
  must-not:
    - 禁止提出开放性问题（如"你的量级是多少？"）

output:
  format: md
  template: |
    ### 方案对比
    | 方案 | 适用条件 | 核心优势 | 风险/代价 |
    |------|----------|----------|-----------|
    | A: <方案> | <什么场景用> | <优势> | <风险> |
    | B: <方案> | <什么场景用> | <优势> | <风险> |

    ### 我的推荐
    👉 **推荐方案 <A/B>**，理由：<一句话>

    ---
    请选择：(A/B/其他)

    # 若信息不足以推荐 → 最多提 2-3 个选择题 → 再次进入 choose mode
