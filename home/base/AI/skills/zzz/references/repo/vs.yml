---

frontmatter:
  name: vs
  role: composite
  desc: 同类竞品逐项 ✅❌ 对比；输出阶段串行调度 table2yml

what:
  is: |
    给我画个 table 进行对比。慎重选择对比项，并告诉我为什么你做出这个判断。

    直接用 ✅、❌ 逐项对比并标记优劣。



constraint:
  must:
    - 维度数量 4–8 个，每个维度说明「为何选这个维」
    - 单元格必须是 ✅ 或 ❌ + 半句事实依据
    - 结论 ≤3 条，若目标是 X 倾向 Y 要给出理由
  must-not:
    - 禁止空 ✅/❌（无依据）
    - 禁止无依据的主观形容词堆砌

workflow:
  - phase: 对比维度选择
    steps:
      - 列出维度表：维度 / 为何选这个维 / 不选哪些常见维（可选）
      - 维度数量 4–8 个
  - phase: 对比表
    steps:
      - 行 = 方案，列 = 对比维度
      - 每格 ✅/❌ + 一句事实依据
  - phase: 输出 YAML
    steps:
      - "对比表产出后，串行起 table2yml sub-agent 把表转成 YAML codeblock；并入位置见 output"
      - kind: prompt
        name: table2yml
  - phase: 结论
    steps:
      - 若目标是 X，倾向 Y，因为 …

output:
  format: md
  template: |
    | 维度 | 为何选这个维 | 不选哪些常见维（可选） |
    |------|--------------|------------------------|
    | ... | ... | ... |

    | 方案 | 维度1 | 维度2 | ... |
    |------|-------|-------|-----|
    | 方案A | ✅/❌ + 依据 | ... | ... |

    ## 结论（≤3 条）
    - 若目标是 X，倾向 Y，因为 …

    （table2yml dispatch 产物：把对比表转成 YAML codeblock，接在结论之后。）
