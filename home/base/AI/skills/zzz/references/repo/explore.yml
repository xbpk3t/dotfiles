frontmatter:
  name: explore
  role: atom
  desc: 替代方案探索；seed-aware；两波 fan-out 并搜；关系标签 peer/covers

what:
  is: |
    替代/备选/同类型的探索：将一个具体工具/框架/方案作为 seed，做波次 fan-out 搜索。
    两波而不是一波（先发散找候选，再以 IKEA / FH 视角找出路和定位）。
  not: |
    不是按目录惯性只搜 GitHub tag / awesome-list。
    不是 seed 套 seed（仅带一次 name）。
    不是主动展开单个候选的深度分析（那是 repo / vs 的事）。

constraint:
  must:
    - "seed 必给：用户输入的具体工具/框架/方案"
    - "仅带一次 name（seed name），不可 seed 套 seed"
    - "从问题域出发搜解决方案，而非只搜 GitHub tag / awesome-list"
    - "并行：每波各路搜索并发跑"
    - "输出固定结构"
  must-not:
    - "不主动展开单个候选的深度分析（那是 repo / vs 的事）"

workflow:
  - phase: 第一波：发散（候选挖掘）
    steps:
      - "从以下各视角并行拉候选，每视角 2～5 个，优先满足多项的：1 同问题域解决（同一问题域的不同解法）；2 竞品替代（直接竞品/生态位重叠）；3 同类抽象层级（抽象层级和定位接近，不限语言生态）；4 升级/降级（更重型 all-in-one/商业 或 更轻量 embeddable/库级）；5 相邻生态集成（seed 所在生态圈的集成/互补工具）"
      - "输出 ## Wave 1 — 候选 表格：候选 | 视角 | 关系 | 一句话"
      - "去重：只保留命中 ≥2 个视角的候选；禁止同视角内保留定位近似的"
      - "关系标签：peer = 同层可替换（问题域、职责定位、输入输出相当）；covers = 比 seed 更全面（范围包含 seed 且不止）"
  - phase: 第二波：IKEA / FH 定位
    gate: 第一波候选已产出
    steps:
      - "FH 视角反问：一句反问「你其实不是想要 A，而是想要 …？」；若无明显线索写「定位待补」"
      - "宜家效应检查：为什么目前是此 seed（顺手/生态锁定/历史决定）；seed 的隐形成本（维护/集成/认知/迁移）；真需要替换吗（替换成本 > 实际差距时建议留守）"
      - "输出 ## Wave 2 — 定位：seed 定位（反问/隐形成本/是否推荐换）+ 候选快筛表（推荐场景/不建议场景/迁移成本/备注）+ 最终建议（一句）"

output:
  format: table
  struct:
    - key: seed 定位
      val: 反问 + 隐形成本 + 是否推荐换
    - key: 候选快筛
      val: 候选 | 推荐场景 | 不建议场景 | 迁移成本 | 备注
  template: |
    ## Wave 1 — 候选

    | 候选 | 视角 | 关系 | 一句话 |
    |------|------|------|--------|

    ## Wave 2 — 定位

    seed 定位：
      反问：…
      隐形成本：…
      是否推荐换：<推荐留守 | 推荐探索 | 不好说>

    候选快筛：
    | 候选 | 推荐场景 | 不建议场景 | 迁移成本 | 备注 |
    |------|---------|-----------|---------|------|

    最终建议：<一句结论>

hint:
  - if: 输出了 peer 候选
    then: 提示 /zzz vs 做对比分析
  - if: 用户选定方向后需深入
    then: 提示 /zzz repo 做仓库分析
