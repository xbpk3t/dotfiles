---

frontmatter:
  name: analogy
  role: atom
  desc: 跨域生活隐喻助记；同一 case 贯穿细节（供 recall pipeline）

what:
  is: 跨域、偏生活的隐喻，降低记忆成本。 # 通常由 /zzz recall 在用户明确同意【类比】后以 sub-agent 调用；也可单独 /zzz analogy（须有明确 topic / gap / 概念）。
  not: 异层同构（那是 `mapping`）、相关 topic 列表、竞品对比（那是 `vs`）。

gate:
  - qs: 用户是否明确同意要类比、且有可挂的 gap？
    fail: "status: skipped + 原因，不硬编"


constraint:
  must:
    - "***同一 case 贯穿：1–3 条类比挂在同一个具体故事/场景上展开细节对应***"
    - 针对 gap / 核心概念现写，不要倾倒素材库
    - 输出 1–3 条，土、好记、一句钉死对应
  must-not:
    - "***禁止假类比***：不同工具 mechanism 互相顶替、只换说法重复定义、品类全家桶"
    - 用「不同工具的不同 mechanism」互相顶替类比（那是 mapping/vs 脏写法）
    - 只换说法重复定义、没有生活域
    - 品类全家桶（「凡 XX 都像 YY」）




output:
  format: md
  template: |
    ## artifact
    step: analogy
    status: ok | skipped
    case: <本轮统一故事线一句话>

    1.
    概念：…
    类比：…
    对应：类比里的 X = 技术里的 Y

    2.
    …

  few-shot: |
    同一「约会/关系」case 贯穿时的密度参考（可换 case，不要换成分散工具清单）：

    - 高可用：有很多备胎，失恋了也能迅速谈恋爱
    - 注册中心：民政局
    - 负载均衡：和多个女朋友轮流约会
    - API 网关：相亲前的介绍人，双方无法直接联系，由介绍人代传
    - 同步/异步：一次只和一个女朋友约会 vs 同时和多个
    - 分布式锁：同时多个约会，要时间管理，否则冲突
    - 分布式缓存：房间开一个月的，每次直接去，不需再开
    - 分布式消息队列：约就来，结束后主动离开
    - 分布式事务：离婚后希望一切回到婚前——所以很难
    - 异地多活：出差到任何城市都有炮友
    - 广播调用：同时向多个求婚，谁先答应和谁结婚
