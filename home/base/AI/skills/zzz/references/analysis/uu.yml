---

frontmatter:
  name: uu
  role: atom
  desc: 挖掘 unknown unknowns；单独使用，不进默认 pipeline


what:
  is: 挖掘本 session 讨论 topic 相关的 unknown unknowns（用户以为自己知道、实际有盲区的点）。
  not: |
    不是知识讲解（那是 3w3h）
    不是竞品对比（那是 vs）
    不是决策建议（那是 choose）

constraint:
  must:
    - 每个要点按"已知表象 → 真相反差"三层结构展开
    - 结尾必须同时给跨主题对比表 + 三条立刻能做的验证命令
    - 使用"你以为 X 但实际 Y"对比框架贯穿全文
  must-not:
    - 禁止在结尾引入文中未出现的新盲点

output:
  format: md
  template: |
    按以下框架组织回答：

    ### 1. 主题分类
    将 unknown unknowns 按 3-5 个主题大类分组，每个大类下用编号列表展开具体点。标题用 `## 一、主题名` 或 `### 1. 主题名` 格式。

    ### 2. 每个点的三层结构
    每个 unknown unknown 要点用 `### N. 主题——反差点` 标题开头（如 `### 1. 单 goroutine 内也不保证可见性顺序`），标题简洁体现主题与反差张力。正文包含：

    - **已知表象**：用户以为自己知道的常规知识（"你可能知道 X"）
    - **真相反差**：实际更深层或反直觉的行为（"但你不知道的是 Y"），强调与"常识"的偏差
    - **代码/命令**：如果适用，提供 Go 代码片段、SQL 查询、yaml 配置或 shell 命令来验证/复现
    - **验证命令**（可选，与第 6 节配合）：每个要点结尾附一条具体命令，用 `**验证**` 或 `**验证命令**` 加粗标记引导，配合 shell 代码块。让用户从"被动阅读"变成"主动验证"。

    ### 3. 对比框架
    贯穿全文使用"你以为 X 但实际 Y"的对比框架。这种"常见误解 vs 现实"的结构是挖掘 unknown unknowns 的核心手段。在常见的"已知已知"基础上，直接揭示"已知但理解有偏差"的层次。

    ### 4. 版本/实现关键点
    关注版本变迁带来的行为差异——标注具体版本号范围（如 Go 1.24+、K8s 1.23+、Redis 7.0+），特别是新版本引入但大多数用户不知道的变化。

    ### 5. 结尾总结
    结尾提供总结性视角，**必须同时包含以下两部分**：

    1. **跨主题对比表**：汇总所有主题下的盲点，形成一张"你以为知道 vs 实际有盲区"对比表。表头固定为两列，每行对比一个盲点，让读者看到不同主题盲点在整体中的关联。
    2. **三条立刻能做的验证**：精选 3 条用户当前就能执行的验证/检查命令，按优先级排列。每条用明确编号（`1.`、`2.`、`3.`），附带具体 shell 命令（用代码块包裹）和一句话说明何时需要关注结果。不要在结尾引入文中未出现的新盲点。

    ### 6. 可操作性验证
    每个 unknown unknown 尽量附带一条用户**现在就能做**的验证动作。例如：
    - 一条 SQL 查询检查当前系统是否存在风险（`SELECT * FROM pg_prepared_xacts`）
    - 一个 `CONFIG SET` 或系统参数调整
    - 一个 `grep` 或 `tcpdump` 命令用于排查
    - 一个交叉对比的代码示例展示"你以为正确" vs "实际正确"的写法

    让用户从"被动阅读"变成"主动验证"。
