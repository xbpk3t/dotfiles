frontmatter:
  name: open-urls
  role: atom
  desc: 批量打开 URL —— 不做存活检测,直接逐个用系统打开命令交付新标签页。

what:
  is: 批量打开 URL。对每个 URL 直接用系统打开命令打开,不做任何存活检测或验证。
  not: 不做死链检测;不做 GitHub API 特判;不用 opencli;不清理死链。

constraint:
  must:
    - "对每个 URL 直接用系统打开命令"
    - "每个 URL 独立新标签页,禁止同 tab 跳转"
    - "逐个依次打开,不用等待任何检测"
  must-not:
    - "禁止任何存活检测(curl / opencli / HEAD 请求 / 验证流程)——直接开"

workflow:
  - phase: 打开
    steps:
      - "逐个对 URL 执行系统打开命令（macOS 用 open,Linux 用 xdg-open (按当前平台二选一)），不检测、不等待"

  # - phase: 汇报
  #   steps:
  #     - "一行摘要:已打开 X 个标签页;若用户提供了 URL 总数,给出比例"

self-check:
  - "没有执行任何 curl/opencli/检测命令"
  - "每个 URL 都被系统打开命令打开了一次"
