---
# deadlink-loop.yml — DAG 名由文件名决定（dagu 2.10+ 顶层不能定义 name）
description: Monthly deadlink scan → AI analyze → human approve → auto delete
schedule: "0 0 1 * *"
max_active_runs: 1

# dagu 没有 runs-on，用 DAG-level precondition 做主机 gate。
# TODO(deadlink): agt 的 opencli-browser（chromium-agent/Xvfb/x11vnc）已按 B 方案移除；
# 这个 DAG 依赖 chromium-agent + opencli，先以 unit 是否存在做 gate（agt 上会 skip）。
# 以后迁到 macos-ws 时，把 start_browser/stop_browser 改成 Mac 版（真实桌面浏览器，
# 无 systemctl/chromium-agent），并确认 Mac 有 nu/lychee/opencli。
preconditions:
  - condition: '[ "$(hostname -s)" = "nixos-vps-agt" ] && systemctl --user cat chromium-agent >/dev/null 2>&1'

env:
  WORKSPACE: ${HOME}/Desktop/docs
  DEADLINK_DIR: /tmp/xbpk3t-docs-deadlink
  BROWSER_MARKER: /tmp/xbpk3t-docs-deadlink-browser-started

steps:
  - id: start_browser
    name: start_browser
    description: "Step 1/9: Ensure the on-demand Chromium is running for OpenCLI"
    run: |
      export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
      if systemctl --user is-active --quiet chromium-agent; then
        echo "chromium-agent already active; will leave it running"
        rm -f "$BROWSER_MARKER"
      else
        systemctl --user start chromium-agent || {
          echo "failed to start chromium-agent" >&2
          exit 1
        }
        echo started > "$BROWSER_MARKER"
      fi
      # 轻量有界等待：Chromium/Browser Bridge 启动不是瞬时完成；最多 10s。
      # lychee 前半段不需要浏览器，但后续 OpenCLI 验证前 bridge 必须 ready。
      for i in $(seq 1 10); do
        if opencli doctor >/dev/null 2>&1; then
          echo "OpenCLI browser ready"
          exit 0
        fi
        sleep 1
      done
      echo "OpenCLI browser not ready after 10s" >&2
      if [ -f "$BROWSER_MARKER" ]; then
        systemctl --user stop chromium-agent || true
        rm -f "$BROWSER_MARKER"
      fi
      exit 1

  - id: scan
    name: scan
    description: "Step 2/9: Run lychee + OpenCLI to find verified dead links"
    run: |
      cd $WORKSPACE
      nu .github/taskfile/scripts/deadlink.nu \
        --data-dirs '["data"]' \
        --output-dir $DEADLINK_DIR \
        --skip-domains '["blog.lucc.dev","supjav.com","fandom.com","missav.ai","missav.live"]'
    depends:
      - start_browser
    timeout_sec: 7200
    continue_on:
      exit_code: 2
      mark_success: true

  - id: stop_browser
    name: stop_browser
    description: "Step 3/9: Stop Chromium if this DAG started it"
    run: |
      export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
      if [ -f "$BROWSER_MARKER" ]; then
        systemctl --user stop chromium-agent
        rm -f "$BROWSER_MARKER"
        echo "stopped chromium-agent (started by DAG)"
      else
        echo "chromium-agent was already running; leaving it alone"
      fi
    depends:
      - scan
    continue_on:
      failure: true

  - id: check_deadlinks
    name: check_deadlinks
    description: "Step 4/9: Check if deadlinks were found; skip downstream if none"
    run: |
      REPORT="$DEADLINK_DIR/deadlink-report.json"
      if [ -f "$REPORT" ] && jq -e '.summary.verified_dead > 0' "$REPORT" > /dev/null 2>&1; then
        echo "verified_dead: $(jq '.summary.verified_dead' "$REPORT")"
        exit 0
      else
        echo "No deadlinks found. Skipping downstream."
        exit 0
      fi
    depends:
      - scan

  - id: ai_analyze
    name: ai_analyze
    description: "Step 5/9: AI reads deadlink report and produces deletion proposal"
    run: |
      cd $WORKSPACE
      nu .github/taskfile/scripts/deadlink-ai-analyze.nu
    depends:
      - check_deadlinks
    preconditions:
      - condition: |
          [ -f "$DEADLINK_DIR/deadlink-report.json" ] && \
          jq -e '.summary.verified_dead > 0' "$DEADLINK_DIR/deadlink-report.json" > /dev/null 2>&1

  - id: generate_script
    name: generate_script
    description: "Step 6/9: Generate verified sed script from AI proposal"
    run: |
      cd $WORKSPACE
      nu .github/taskfile/scripts/deadlink-generate-script.nu
    depends:
      - ai_analyze

  - id: human_gate
    name: human_gate
    description: "Step 7/9: Review deadlink proposal and approve or reject"
    action: noop
    depends:
      - generate_script
    preconditions:
      - condition: |
          [ -f "$DEADLINK_DIR/deadlink-review.md" ]
    approval:
      prompt: |
        ## Deadlink 清理审批

        请审查 `deadlink-review.md` 中的 deadlink 列表。

        - **Approve**: 自动执行 sed 删除所有 ✅ 标记的 deadlink URL
        - **Reject**: 本次不处理，保留所有文件不变

        ✅ 标记的条目会自动删除（已验证唯一性和行号准确性）。
        ❌ 标记的条目不会自动处理，需要你手动介入。

  - id: apply
    name: apply
    description: "Step 8/9: Execute verified deletion script"
    run: |
      SCRIPT="$DEADLINK_DIR/verified-deletion-script.sh"
      if [ -f "$SCRIPT" ] && [ -s "$SCRIPT" ]; then
        bash "$SCRIPT"
        echo "Applied $(grep -c '^sed' "$SCRIPT") deletions"
      else
        echo "No deletion script found or empty — nothing to apply"
      fi
    depends:
      - human_gate

  - id: recheck_commit
    name: recheck_commit
    description: "Step 9/9: Recheck and commit changes"
    run: |
      cd $WORKSPACE
      lychee --cache --max-cache-age 0h data/**/*.yml --format summary 2>&1 | tail -5
      git add -A
      if ! git diff --cached --quiet; then
        git commit -m "chore: monthly deadlink cleanup ($(date +%Y-%m))"
        echo "Committed deadlink cleanup"
      else
        echo "No changes to commit"
      fi
    depends:
      - apply
