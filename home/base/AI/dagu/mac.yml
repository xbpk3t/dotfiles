---

name: mac-cleanup
description: "mac 日常维护相关"
schedule: "0 0 1 * *" # 每月一次（每月 1 号 0 点）
max_active_runs: 1



steps:

  - id: upgrade_brew
    run: task -g brew


  - id: cleanup_mac
    run: mole cleanup

  # colima 日常用完即关；仅在运行中才 prune（docker 镜像/build cache 约 4G 可回收）
  - id: docker_prune
    run: colima status >/dev/null 2>&1 && docker system prune -af --filter "until=168h" || true
