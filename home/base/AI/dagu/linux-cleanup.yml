---

description: "磁盘压力清理（仅 / 使用率 >=85% 时执行）"
schedule: "30 4 * * *" # 每天 04:30，避开 04:00 的 nix-gc
max_active_runs: 1

# dagu 没有 runs-on，用 DAG-level precondition 做主机和磁盘 gate。
preconditions:
  - condition: '[ "$(hostname -s)" = "nixos-vps-agt" ] || [ "$(hostname -s)" = "nixos-vps-dev" ]'
  - condition: '[ "$(df --output=pcent / | tail -n 1 | tr -dc "0-9")" -ge 85 ]'

steps:
  - id: go_cache
    run: command -v go >/dev/null && go clean -cache || true

  - id: npm_cache
    # verify 只回收可回收条目，比 clean --force 温和。
    run: command -v npm >/dev/null && npm cache verify || true

  - id: pnpm_store
    run: command -v pnpm >/dev/null && pnpm store prune || true

  - id: precommit_cache
    run: command -v pre-commit >/dev/null && pre-commit clean || true

  # dev 上才有 docker；不碰 volumes。
  - id: docker_images
    run: command -v docker >/dev/null && docker image prune -a -f || true
