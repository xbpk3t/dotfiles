# nvfetcher 只负责统一维护 upstream version / src hash / fetch recipe。
# 真正的打包逻辑仍然保留在 pkgs/<name>/default.nix 中。
#
# 当前先只接入适合”直接消费 release artifact”的 package：
# - 维护成本最低
# - 不会把 builder 选型和 source 更新流程耦合在一起

[chrome-devtools-mcp]
# 这里用 `gh release view` 读取最新 release tag，再在 nvfetcher 层剥掉 tag 前缀。
# Why:
# - 我们最终消费的是 npm 发布包本身，不是从 GitHub 源码重建；
# - upstream 的 GitHub tag 形如 `chrome-devtools-mcp-v0.21.0`，而 npm tarball URL 需要裸版本 `0.21.0`；
# - 直接问 GitHub release API 比访问 npm registry 的 latest JSON 更贴近这个项目的发布入口；
# - `from_pattern/to_pattern` 只负责把 tag 转成 npm tarball 需要的裸版本，source update 逻辑仍然留在 nvfetcher 层。
src.cmd = "gh release view -R ChromeDevTools/chrome-devtools-mcp --json tagName -q .tagName"
src.from_pattern = "chrome-devtools-mcp-v(.+)"
src.to_pattern = "\\1"
fetch.url = "https://registry.npmjs.org/chrome-devtools-mcp/-/chrome-devtools-mcp-$ver.tgz"

[trzsz]
src.github_tag = "trzsz/trzsz-go"
src.from_pattern = "^(v([0-9\\.]+))$"
src.to_pattern = "\\1"
fetch.github = "trzsz/trzsz-go"

[launchk]
src.github = "intellekthq/launchk"
fetch.github = "intellekthq/launchk"

[cc-connect]
# Go 项目，从源码构建。buildGoModule 自行处理 Go module 依赖。
src.github = "chenhg5/cc-connect"
fetch.github = "chenhg5/cc-connect"

[voltagent-subagents]
# 社区 sub-agent 仓库暂无 release/tag，用 manual + latest commit hash 确保可复现。
# 后续上游打 tag 后可切回 src.github_tag。
src.manual = "5983fe3b4ea2785335ac1712c4aa1ac4e13a8fa2"
fetch.github = "VoltAgent/awesome-claude-code-subagents"

[herdr-focus-notify]
# Herdr plugin：agent blocked/done 时发 macOS 可点击通知（依赖 alerter，brew 管理）。
# 无 release 产物，从源码构建（buildRustPackage）。
# 上游无 tag，用 manual 固定 commit（当前 herdr plugin install 用的 a7d17a5）；
# 之后要升级时改这个 hash 再跑 nvfetcher。
src.manual = "a7d17a532304e285a791749cb5d7b706b6a7ecb9"
fetch.github = "yankewei/herdr-focus-notify"

[herdr-reviewr-src]
# herdr plugin：code review 工具（persiyanov/herdr-reviewr）。
# 二进制走 release asset（4 平台 × 独立 sha256，见 pkgs/herdr-reviewr/default.nix 内 assetBySystem/binaryHashes），
# nvfetcher 这里只锁源码 tag —— 升级时 src 与包内 version/asset/hash 三处同步 bump。
src.github_tag = "persiyanov/herdr-reviewr"
fetch.github = "persiyanov/herdr-reviewr"
