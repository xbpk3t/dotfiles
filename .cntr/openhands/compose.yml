---
# 本地试跑：OpenHands Agent Canvas
#
# 目标：
#   1. 每个 conversation 有独立 URL，可重开继续；公开分享链接只读
#   2. 直接读本地 docs 目录（只读），输出写到 workspace
#   3. 直接挂载 dotfiles skills 源（只读）
#   4. 接 AxonHub（OpenAI-compatible / LiteLLM）
#
# 启动：docker compose up -d
# 日志：docker compose logs -f openhands
# 停止：docker compose down
# 清数据：docker compose down -v && rm -rf workspace

name: openhands

services:
  openhands:
    image: ghcr.io/openhands/agent-canvas:1.40.0
    container_name: openhands
    ports:
      # 只绑本机；OpenHands 本地模式会把 session key 注入页面
      - "127.0.0.1:8000:8000"
    environment:
      LOCAL_BACKEND_API_KEY: ${LOCAL_BACKEND_API_KEY:?set LOCAL_BACKEND_API_KEY in .env}
      # 仅当宿主端口只绑 127.0.0.1 时开启；避免每次打开都要手输 API key
      AGENT_CANVAS_ALLOW_LAN_SESSION_KEY: "true"
    volumes:
      # 设置、会话、聊天记录
      - openhands_state:/home/openhands/.openhands
      # 可写工作区：agent 的产出、临时文件
      - ./workspace:/projects/work
      # docs 只读：问答/分析不改进原仓库
      - ${HOME}/Desktop/docs:/projects/work/docs:ro
      # skills 只读：直接吃 dotfiles 里的 SKILL.md
      - ${HOME}/Desktop/dotfiles/home/base/AI/skills:/projects/work/.openhands/skills:ro
    restart: unless-stopped
    # Agent + Agent Server + Automation + 前端；4g 足够本地试跑
    mem_limit: 4g
    memswap_limit: 4g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  openhands_state:
