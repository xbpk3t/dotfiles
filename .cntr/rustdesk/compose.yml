# 2026-11-16: rustdesk-server 1.1.16 移除了 `-m demo`；旧命令会导致 restart loop。
# 钉 1.1.16；hbbs 的 relay server 用 RUSTDESK_HOST（默认 VPS 公网 IP）。
services:
  rust_desk_hbbs:
    container_name: rust_desk_hbbs
    image: rustdesk/rustdesk-server:1.1.16
    restart: always
    ports:
      - "21114:21114"
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    command: ["hbbs", "-r", "${RUSTDESK_HOST:-192.129.183.26}"]
    volumes:
      - rust_desk_hbbs_data:/root
    networks:
      - rust_desk_net

  rust_desk_hbbr:
    container_name: rust_desk_hbbr
    image: rustdesk/rustdesk-server:1.1.16
    restart: always
    ports:
      - "21117:21117"
      - "21119:21119"
    command: ["hbbr"]
    volumes:
      - rust_desk_hbbr_data:/root
    networks:
      - rust_desk_net

volumes:
  rust_desk_hbbs_data:
    name: rust_desk_hbbs_data
  rust_desk_hbbr_data:
    name: rust_desk_hbbr_data

networks:
  rust_desk_net:
    driver: bridge
