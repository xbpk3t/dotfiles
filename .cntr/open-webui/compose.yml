---
# 本地试跑：Open WebUI + Open Terminal
#
# 目标：
#   1. Open WebUI 通过 AxonHub 公网入口调用模型
#   2. Open Terminal 只读访问本地 docs 项目 + 直接扫描 ~/.claude/skills
#   3. 不发布 Open Terminal 端口，不挂 docker.sock，不加入 edge，不写 Caddy
#
# 启动：docker compose up -d
# 日志：docker compose logs -f open-webui open-terminal
# 停止：docker compose down
# 清数据：docker compose down -v && rm -rf ./data

name: open-webui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.3-slim
    container_name: open-webui
    ports:
      # 容器内固定 8080；宿主只绑 127.0.0.1，避开 VPS 上 qbittorrent 预留的 8080
      - "127.0.0.1:3000:8080"
    volumes:
      - ./data:/app/backend/data
    environment:
      # AxonHub OpenAI-compatible 入口
      OPENAI_API_BASE_URL: https://api.lucc.dev/v1
      OPENAI_API_KEY: ${OPEN_WEBUI_AXONHUB_KEY:?set OPEN_WEBUI_AXONHUB_KEY in .env}
      ENABLE_OPENAI_API: "true"
      # 本地没有 Ollama，关掉以免启动时反复探测 host.docker.internal:11434
      ENABLE_OLLAMA_API: "false"
      DEFAULT_MODELS: deepseek-v4.1-flash

      # 首次启动自动建管理员并关注册，避免“先开 signup 再关”的窗口
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-Admin}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:?set WEBUI_ADMIN_EMAIL in .env}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?set WEBUI_ADMIN_PASSWORD in .env}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
      WEBUI_URL: http://localhost:3000
      ENABLE_SIGNUP: "false"

      # Web search：复用宿主 TAVILY_API_KEY，不额外起 SearXNG
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: tavily
      TAVILY_API_KEY: ${TAVILY_API_KEY:?set TAVILY_API_KEY in .env}

      # RAG 关闭：不触发 embedding/retrieval。
      # 注意：仅设 BYPASS_* 仍会在启动时加载本地 SentenceTransformers（约 97MB 缓存、~400MB 内存）。
      # 把 engine 指到 openai 让启动阶段不加载本地模型；bypass=true 保证运行时也不会真的去调它。
      BYPASS_EMBEDDING_AND_RETRIEVAL: "true"
      BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: "true"
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: text-embedding-3-small
      RAG_OPENAI_API_BASE_URL: https://api.lucc.dev/v1
      RAG_OPENAI_API_KEY: ${OPEN_WEBUI_AXONHUB_KEY:?set OPEN_WEBUI_AXONHUB_KEY in .env}
      RAG_EMBEDDING_MODEL_AUTO_UPDATE: "false"

      # Open Terminal 连接依赖此开关
      ENABLE_TOOL_SERVERS: "true"
      # 首次启动写入 DB，之后以 DB 为准；改这里需要清 data/ 或走管理 API
      TERMINAL_SERVER_CONNECTIONS: >-
        [
          {
            "id": "open-terminal",
            "name": "Open Terminal",
            "enabled": true,
            "url": "http://open-terminal:8000",
            "path": "/openapi.json",
            "key": "${OPEN_TERMINAL_API_KEY}",
            "auth_type": "bearer",
            "forward_cookies": false,
            "config": {
              "access_grants": [],
              "user_shell_tools": "auto"
            }
          }
        ]
    depends_on:
      open-terminal:
        condition: service_healthy
    restart: unless-stopped
    # 与 axonhub 同样的 OOM 理由：把内存问题关在容器内，不拖垮宿主
    mem_limit: 2g
    memswap_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:0.17.7-slim
    container_name: open-terminal
    # slim 镜像默认 WORKDIR=/app；Open Terminal 用 cwd 作为 skills 扫描根，必须指到 home
    working_dir: /home/user
    # Open Terminal 的 skills 扫描根是 home；只挂你自己的 dotfiles skills 源。
    # 不再挂 ~/.claude/skills：那里有指向 /nix/store 的 symlink，容器内是断的。
    # ${HOME} 同时适配 Mac (/Users/luck) 和 VPS (/home/luck)。
    volumes:
      - open_terminal_data:/home/user
      - ${HOME}/Desktop/docs:/home/user/project:ro
      - ${HOME}/Desktop/dotfiles/home/base/AI/skills:/home/user/.claude/skills:ro
    environment:
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY:?set OPEN_TERMINAL_API_KEY in .env}
      # 禁止终端容器主动出网；Open WebUI 仍可通过 Docker 内网访问它
      OPEN_TERMINAL_ALLOWED_DOMAINS: ""
    cap_add:
      # entrypoint 用 iptables 建立 deny-all，然后 capsh 丢弃该能力
      - NET_ADMIN
    # 不挂 docker.sock：终端只应读写自己的 home/只读挂载
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/openapi.json"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  open_terminal_data:
