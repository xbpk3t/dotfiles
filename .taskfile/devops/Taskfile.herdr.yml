---
version: "3"

# 脚本目录相对本文件定位，不依赖 USER_WORKING_DIR
vars:
  HERDR_SCRIPTS_DIR: '{{.TASKFILE_DIR}}/scripts'

dir: '{{.USER_WORKING_DIR}}'

tasks:
  strike:
    desc: "通过 herdr 批量深潜：按 h2 拆 md → 各 pane 独立 agent；收尾用 herdr-z finish（uu + conclusion + export + close pane）"
    summary: |
      Usage:
        task herdr:strike [<md文件>] <h2标题1,h2标题2,...> [NUM=5]
    silent: true
    vars:
      # 第一参是 md 文件用；否则默认 temp.md
      MD_FILE: '{{.CLI_ARGS | splitList " " | first | default "~/Desktop/docs/wiki/temp.md"}}'
      # 去掉第一参的其余部分
      TOPICS: '{{.CLI_ARGS | splitList " " | rest | join ","}}'
      NUM: '{{default "5" .NUM}}'
    preconditions:
      - test -n '{{.TOPICS}}'
      - sh: test -f '{{.MD_FILE}}'
        msg: "md 文件不存在: {{.MD_FILE}}"
      - sh: command -v mq
        msg: "缺少依赖: mq"
      - sh: command -v herdr
        msg: "缺少依赖: herdr"
    cmds:
      - nu '{{.HERDR_SCRIPTS_DIR}}/herdr/strike.nu' '{{.MD_FILE}}' '{{.TOPICS}}' --num '{{.NUM}}'

  finish:
    desc: "herdr 收尾：对目标 pane 执行 uu + conclusion + ccx export + close（脚本强制版）"
    summary: |
      Usage:
        task herdr:finish                       # 收尾当前焦点/匹配的 pane
        task herdr:finish <pane_id>             # 收尾指定 pane
    silent: true
    vars:
      PANE: '{{default "" .CLI_ARGS}}'
    preconditions:
      - sh: command -v herdr
        msg: "缺少依赖: herdr (需 herdr server 运行中)"
      - sh: command -v ccx
        msg: "缺少依赖: ccx"
    cmds:
      - nu '{{.HERDR_SCRIPTS_DIR}}/herdr/finish.nu' '{{.CLI_ARGS}}'
