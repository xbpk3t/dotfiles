---
version: "3"

# Why: 新购 VPS 的 ecs-only 体检入口（Nushell 单文件）。
#
# Q: 为什么只跑 ecs？
# A: ecs 已覆盖 IP 质量（19 个库）、解锁（~30 平台）、邮件端口、DNSBL、
#    回程/PING/就近测速和硬件。NetQuality 的独有价值只剩 BGP/IX、
#    31 省三网延迟矩阵和全球 iperf3；IPQuality 与 ecs 高度重叠。
#    默认 ecs-only 约 6-8 分钟，避免之前三件套 60+ 分钟。
#
# Q: fresh 和 managed 有什么区别？
# A: fresh   = 已安装 nushell 的新机器：脚本用发行版包管理器装依赖。
#    managed = NixOS：Taskfile 用 nix-shell 提供 nushell + 依赖，绝不改系统；
#              默认 --stop-proxy（停 mihomo -> 跑 -> try/finally 恢复）。
#
# Q: 为什么用 Nushell？
# A: 单文件、typed main、结构化解析；mihomo 恢复用 try/finally。
#    Ctrl-C 会进入 finally；SIGTERM/SIGHUP 不保证。
#
# Q: fresh 机器怎么引导 nushell？
# A: 本项目不附带 bash 引导器；fresh 机器需预装 nushell。
#    脚本不再支持 curl | sudo bash。
#
# Q: 怎么 lint？
# A: task -t .taskfile/kernel/Taskfile.vps.yml lint
#    nix-shell 提供 nushell / nufmt / nu-lint。
#
# 常用入口：
#   task -t .taskfile/kernel/Taskfile.vps.yml default
#   task -t .taskfile/kernel/Taskfile.vps.yml fresh
#   task -t .taskfile/kernel/Taskfile.vps.yml lint
#   sudo nu .taskfile/kernel/scripts/vps-check.nu --profile fresh

vars:
  # ecs + installer 所需；nushell 是脚本解释器。
  NIX_DEPS: "nushell curl unzip iproute2 procps dmidecode bc jq gnutar iputils coreutils sysbench fio"
  SCRIPT: "scripts/vps-check.nu"

tasks:
  default:
    desc: "Managed NixOS: ecs check in nix-shell (stops/restores mihomo)"
    aliases: [quick, full] # compatibility: ecs-only now
    summary: |
      task -t .taskfile/kernel/Taskfile.vps.yml default
      task -t .taskfile/kernel/Taskfile.vps.yml default -- --out /root/vps-check
    cmd: |
      nix-shell -p {{.NIX_DEPS}} --run 'sudo env PATH="$PATH" nu {{.SCRIPT}} --profile managed --stop-proxy {{.CLI_ARGS}}'

  no-proxy:
    desc: "Managed NixOS: do not stop mihomo; run with --allow-proxy (results may be invalid)"
    summary: "task -t .taskfile/kernel/Taskfile.vps.yml no-proxy"
    cmd: |
      nix-shell -p {{.NIX_DEPS}} --run 'sudo env PATH="$PATH" nu {{.SCRIPT}} --profile managed --allow-proxy {{.CLI_ARGS}}'

  direct:
    desc: "Managed NixOS: run without nix-shell (deps must already be in root PATH)"
    summary: "task -t .taskfile/kernel/Taskfile.vps.yml direct"
    cmd: |
      sudo env PATH="$PATH" nu {{.SCRIPT}} --profile managed {{.CLI_ARGS}}

  fresh:
    desc: "Fresh VPS: nushell must be installed; auto-install ecs deps"
    summary: "task -t .taskfile/kernel/Taskfile.vps.yml fresh"
    cmd: |
      sudo env PATH="$PATH" nu {{.SCRIPT}} --profile fresh {{.CLI_ARGS}}

  no-deps:
    desc: "Compatibility alias: managed run with --no-install (managed never installs anyway)"
    summary: "task -t .taskfile/kernel/Taskfile.vps.yml no-deps"
    cmd: |
      nix-shell -p {{.NIX_DEPS}} --run 'sudo env PATH="$PATH" nu {{.SCRIPT}} --profile managed --stop-proxy --no-install {{.CLI_ARGS}}'

  out-local:
    desc: "Managed NixOS: write reports under ./.reports"
    summary: "task -t .taskfile/kernel/Taskfile.vps.yml out-local"
    cmd: |
      nix-shell -p {{.NIX_DEPS}} --run 'sudo env PATH="$PATH" nu {{.SCRIPT}} --profile managed --stop-proxy --out ./.reports {{.CLI_ARGS}}'

  lint:
    desc: "Nushell syntax, format, and correctness lint (nufmt + nu-lint)"
    summary: "task -t .taskfile/kernel/Taskfile.vps.yml lint"
    cmd: |
      nix-shell -p nushell nufmt nu-lint --run 'set -e; nu -c "source {{.SCRIPT}}"; nufmt --dry-run {{.SCRIPT}}; nu-lint check --only catch-runtime-failures,annotate-types {{.SCRIPT}}'
