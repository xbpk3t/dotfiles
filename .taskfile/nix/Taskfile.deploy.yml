---
# 部署入口按平台轨道分为三条，互不混用：
#
#   task nix:deploy       nixos + darwin           deploy-rs（deploy.nodes）
#   task nix:deploy:sm    sm-vps                   deploy-rs + sm 专属后处理
#   task nix:deploy:hm    ansible-hm (hm-only PA)  Ansible 本地 build + activate
#
# 节点事实来自 flake .#deployRoutes（lib/fleet 派生 driver/kind）；新增同类节点
# 会自动出现在对应轨道，不要在 Taskfile 里手写节点名单。
# sm 节点不在 nix:deploy 里：sm 需要额外的 zsh/drop-in 后处理，必须走 nix:deploy:sm。
#
# [2026-01-25] 从colmena -> deploy-rs 之后，就不需要把 darwin 和 nixos 拆分到不同taskfile了（因为colmena不支持 multi-profile，所以darwin可能使用 darwin-rebuild 命令或者 nh这种第三方工具来部署，NixOS可能使用 nixos-cli 或者 colmena来部署，并不统一。但是切换到 deploy-rs 之后就不需要考虑这些问题了，统一使用 deploy-rs 进行部署即可）


version: '3'

vars:
  # 部署脚本统一收口在 .taskfile/nix/scripts，Taskfile 只做薄封装。
  SCRIPTS_DIR: "{{.TASKFILE_DIR}}/scripts"
  # nix:deploy：nixos + darwin（driver=deploy-rs，排除 sm 轨）。
  # Why：deploy 依赖当前工作树里的本地 flake；仓库里存在未 track 的源码目录时，
  #      pure flake 评估会直接失败。What：脚本内部用 `--impure` 评估。
  NODES_CMD: 'nu "{{.SCRIPTS_DIR}}/deploy.nu" routes --track nixos-darwin'
  # Why：deploy-rs 自带的 pre-build checks 会再次以 pure flake 方式检查目标，
  #      在存在未 track 源码目录时会提前失败。
  # What：这里统一跳过它的内建 checks，并把 `--impure` 继续透传给后续 Nix
  #       评估/构建阶段；这样 deploy 入口仍绑定本仓库 flake.lock，同时兼容当前
  #       working tree。
  DEPLOY_RS_CMD: "nix run --impure .#deploy-rs -- --skip-checks"
  # 并发执行上限（可通过环境变量 CONCURRENCY 覆盖）
  CONCURRENCY_DEFAULT: "4"
  CONCURRENCY_RESOLVED: '{{.CONCURRENCY | default .CONCURRENCY_DEFAULT}}'

tasks:
  default:
    desc: "部署 nixos/darwin（deploy-rs，支持多选）"
    summary: |
      task nix:deploy
      task nix:deploy NODES=nixos-vps-dev
      task nix:deploy NODES=all

      只列 nixos + darwin 的 deploy-rs 节点。
        - sm-vps：task nix:deploy:sm（带 sm 后处理）
        - hm-only PA：task nix:deploy:hm（ansible-hm）
    dir: '{{.USER_WORKING_DIR}}'
    # 通过 env 传递，避免把 NODES/NODE 直接插值进 shell 双引号（注入风险）。
    env:
      NODES_INPUT: '{{.NODES | default ""}}'
      NODE_INPUT: '{{.NODE | default ""}}'
    set: [errexit, nounset, pipefail]
    cmds:
      - |
        if [ -n "$NODES_INPUT" ]; then
          input="$NODES_INPUT"
        elif [ -n "$NODE_INPUT" ]; then
          input="$NODE_INPUT"
        else
          input=""
        fi

        if [ -n "$input" ]; then
          if [ "$input" = "all" ]; then
            hosts="$({{.NODES_CMD}})"
          else
            hosts="$(printf "%s\n" "$input" | tr ',' '\n')"
          fi
        else
          hosts="$({{.NODES_CMD}} | gum choose --no-limit --header "选择节点（可多选：nixos/darwin）")"
        fi

        if [ -z "$hosts" ]; then
          echo "No node selected"
          exit 1
        fi
        # NOTE: xargs 在 -I 模式下会按行逐个替换，-n1 与其冲突且会触发 warning。
        printf "%s\n" "$hosts" | xargs -P "{{.CONCURRENCY_RESOLVED}}" -I{} \
          {{.DEPLOY_RS_CMD}} ".#{}" -- --impure

  auto:
    desc: "无人值守：并行部署所有 deploy.auto=true 节点（逐台 closure skip）"
    summary: |
      task nix:deploy:auto REVISION=<sha> CONCURRENCY=4

      只处理 hosts/**/meta.nix 中 deploy.auto = true 的节点。
      每台先比对 deploy-rs profile closure；已在目标 closure 的直接 skip。
      单台失败不阻塞其他机器；workflow 最终失败，下次只重试未收敛节点。
    dir: '{{.USER_WORKING_DIR}}'
    # 与 default task 相同：通过 env 传参，避免把用户输入插值进 shell 命令行。
    env:
      REVISION_INPUT: '{{.REVISION | default ""}}'
      CONCURRENCY_INPUT: '{{.CONCURRENCY | default .CONCURRENCY_DEFAULT}}'
      LOG_DIR_INPUT: '{{.LOG_DIR | default "deploy-logs"}}'
      SUMMARY_JSON_INPUT: '{{.SUMMARY_JSON | default "deploy-summary.json"}}'
      SUMMARY_MD_INPUT: '{{.SUMMARY_MD | default "deploy-summary.md"}}'
    set: [errexit, nounset, pipefail]
    cmds:
      - |
        case "$CONCURRENCY_INPUT" in
          ''|*[!0-9]*)
            echo "CONCURRENCY must be a non-negative integer" >&2
            exit 1
            ;;
        esac
        nu "{{.SCRIPTS_DIR}}/deploy.nu" auto \
          --desired-revision "$REVISION_INPUT" \
          --concurrency "$CONCURRENCY_INPUT" \
          --log-dir "$LOG_DIR_INPUT" \
          --summary-json "$SUMMARY_JSON_INPUT" \
          --summary-md "$SUMMARY_MD_INPUT" {{if .DRY_RUN}}--dry-run{{end}} {{if .ALLOW_DIRTY}}--allow-dirty{{end}}


# [2026-04-27] 其实没啥用，注释掉
#  list:
#    desc: "列出 deploy-rs nixos/darwin 节点"
#    summary: "task -g list"
#    dir: '{{.USER_WORKING_DIR}}'
#    cmds:
#      - '{{.NODES_CMD}}'

  sm:
    desc: "部署 sm-vps 轨（deploy-rs + sm 后处理，支持多选）"
    summary: |
      task nix:deploy:sm                        # 交互多选
      task nix:deploy:sm NODE=sm-vps-tc         # 单节点（兼容旧用法）
      task nix:deploy:sm NODES=sm-vps-tc,sm-vps-hk

      部署内容（deploy.nodes.<node>，见 lib/mkHost.nix + hosts/sm-vps/）：
        - profiles.system → system-manager（custom activate，root）
        - profiles.home   → standalone HM（activate.home-manager，luck）
        - profilesOrder   先 system 后 home
        - remoteBuild=true（目标机构建，Mac 零闭包下载）

      后处理（sm 专属，deploy-rs 之后逐个节点执行）：
        - 登录 shell 切到 zsh
        - reload/restart sshd/journald/logind，让 drop-in 生效

      前置（bootstrap，一次性，不入库）：
        1. 目标机能 SSH：Mac pubkey 已进目标机 luck 的 authorized_keys
        2. 目标机已装多用户 Nix（nix-daemon 运行中）
        3. sudo PATH 含 nix（/etc/sudoers.d/99-nix-path）+ /etc/environment 含 nix
           （否则 deploy-rs 激活时 nix-env 找不到）
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - |
        nu "{{.SCRIPTS_DIR}}/deploy.nu" sm \
          --node "{{.NODE | default ""}}" \
          --nodes "{{.NODES | default ""}}" \
          --node-host "{{.NODE_HOST | default ""}}" \
          --node-user "{{.NODE_USER | default ""}}" {{if .DRY_RUN}}--dry-run{{end}}

  hm:
    desc: "部署 ansible-hm 轨（hm-only PA，支持多选）"
    summary: |
      task nix:deploy:hm                        # 交互多选
      task nix:deploy:hm NODES=hm-lightvela     # 指定节点
      task nix:deploy:hm NODES=a,b

      只列 .#deployRoutes 中 driver=ansible-hm 的节点。
      部署走 hosts/_base/hm/ansible：PA 本地 nix-portable build + activate。
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - |
        nu "{{.SCRIPTS_DIR}}/deploy.nu" hm \
          --nodes "{{.NODES | default ""}}" \
          --inventory "{{.INVENTORY | default ""}}" \
          --interactive {{if .DRY_RUN}}--dry-run{{end}} \
          --extra-args "{{.CLI_ARGS}}"

  smoke:
    desc: "sm-vps 部署后 smoke check（验证 etc/unit/secret/tailnet/SSH）"
    summary: |
      deploy-rs 部署到真机后，SSH 进去验证关键状态是否都绿。

      用法：
        task nix:deploy:smoke NODE=sm-vps-tc

      验证项：
        - SSH 服务 active（确认 sm 没破坏 sshd）
        - sm flag 文件（/etc/sm-vps-managed）node= 正确
        - sm marker unit active
        - HM profile 生效（~/.nix-profile）
        - sops secrets 数量 > 0
        - tailscale 在线
    dir: '{{.USER_WORKING_DIR}}'
    vars:
      NODE: '{{.NODE | default "sm-vps-tc"}}'
    cmds:
      - |
        set -euo pipefail
        node="{{.NODE}}"
        # host/user 从 fleet registry 推导（N5：不再硬编码；NODE_HOST/NODE_USER 可覆盖）
        host="{{.NODE_HOST | default ""}}"
        user="{{.NODE_USER | default ""}}"
        if [ -z "$host" ]; then
          host="$(nix eval --impure --raw ".#deploy.nodes.${node}.hostname")"
        fi
        if [ -z "$user" ]; then
          user="$(nix eval --impure --raw ".#deploy.nodes.${node}.sshUser")"
        fi
        echo "==> smoke check ${node} (${host})"
        ssh -o BatchMode=yes -o ConnectTimeout=15 "${user}@${host}" 'bash -lc "
          set -euo pipefail
          echo \"[1] SSH: \$(systemctl is-active ssh 2>/dev/null || systemctl is-active sshd 2>/dev/null || echo inactive)\"
          echo \"[2] sm flag: \$(grep node= /etc/sm-vps-managed 2>/dev/null || echo MISSING)\"
          echo \"[3] sm unit: \$(systemctl is-active sm-vps-managed-marker)\"
          echo \"[4] HM: \$(readlink ~/.nix-profile | head -c 30)...\"
          echo \"[5] sops secrets: \$(ls ~/.config/sops-nix/secrets/ 2>/dev/null | wc -l)\"
          echo \"[6] tailscale: \$(sudo -n tailscale status 2>/dev/null | head -1)\"
          echo \"[7] sshd hardened: \$(grep -c PermitRootLogin /etc/ssh/sshd_config.d/99-sm-hardening.conf 2>/dev/null || echo 0)\"
          echo \"[8] mihomo: \$(systemctl is-active mihomo 2>/dev/null || echo disabled)\"
        "'

