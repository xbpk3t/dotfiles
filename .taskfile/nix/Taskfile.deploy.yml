---
# [2026-01-25] 从colmena -> deploy-rs 之后，就不需要把 darwin 和 nixos 拆分到不同taskfile了（因为colmena不支持 multi-profile，所以darwin可能使用 darwin-rebuild 命令或者 nh这种第三方工具来部署，NixOS可能使用 nixos-cli 或者 colmena来部署，并不统一。但是切换到 deploy-rs 之后就不需要考虑这些问题了，统一使用 deploy-rs 进行部署即可）


version: '3'

vars:
  # 统一获取 deploy-rs 节点列表，使用换行分隔，供交互选择/批量执行复用
  # Why：deploy 依赖当前工作树里的本地 flake；仓库里存在未 track 的源码目录时，
  #      pure flake 评估会直接失败。
  # What：这里显式加 `--impure`，让 deploy 入口按 working tree 评估。
  NODES_CMD: "nix eval --impure --raw .#deploy.nodes --apply 'x: builtins.concatStringsSep \"\\n\" (builtins.attrNames x)'"
  # Why：deploy-rs 自带的 pre-build checks 会再次以 pure flake 方式检查目标，
  #      在存在未 track 源码目录时会提前失败。
  # What：这里统一跳过它的内建 checks，并把 `--impure` 继续透传给后续 Nix
  #       评估/构建阶段；这样 deploy 入口仍绑定本仓库 flake.lock，同时兼容当前
  #       working tree。
  DEPLOY_RS_CMD: "nix run --impure .#deploy-rs -- --skip-checks"
  # 并发执行上限（可通过环境变量 CONCURRENCY 覆盖）
  CONCURRENCY_DEFAULT: "4"
  CONCURRENCY_RESOLVED: '{{.CONCURRENCY | default .CONCURRENCY_DEFAULT}}'

tasks:
  default:
    desc: "deploy-rs 部署（支持多选）"
    summary: "task -g default"
    dir: '{{.USER_WORKING_DIR}}'
    vars:
      HOSTS:
        sh: '{{.NODES_CMD}} | gum choose --no-limit --header "选择节点（可多选）"'
    cmds:
      - |
        if [[ -z "{{.HOSTS}}" ]]; then
          echo "No node selected"
          exit 1
        fi
        # NOTE: xargs 在 -I 模式下会按行逐个替换，-n1 与其冲突且会触发 warning。
        printf "%s\n" "{{.HOSTS}}" | xargs -P "{{.CONCURRENCY_RESOLVED}}" -I{} \
          {{.DEPLOY_RS_CMD}} ".#{}" -- --impure


# [2026-04-27] 其实没啥用，注释掉
#  list:
#    desc: "列出 deploy-rs 节点"
#    summary: "task -g list"
#    dir: '{{.USER_WORKING_DIR}}'
#    cmds:
#      - '{{.NODES_CMD}}'

  sm:
    desc: "deploy-rs 部署 sm-vps 平行轨（sm + standalone HM 双 profile）"
    summary: |
      从 Mac 用 deploy-rs 部署到非 NixOS 目标（真机 sm-vps-tc）。

      用法（在 Mac、dotfiles 仓库根目录）：
        task nix:deploy:sm                       # 默认全部 sm-vps 节点
        task nix:deploy:sm NODE=sm-vps-tc        # 指定真机

      部署内容（deploy.nodes.<node>，见 outputs/x86_64-linux/src/sm-vps.nix）：
        - profiles.system → system-manager（custom activate，root）
        - profiles.home   → standalone HM（activate.home-manager，luck）
        - profilesOrder   先 system 后 home
        - remoteBuild=true（目标机构建，Mac 零闭包下载）

      前置（bootstrap，一次性，不入库）：
        1. 目标机能 SSH：Mac pubkey 已进目标机 luck 的 authorized_keys
        2. 目标机已装多用户 Nix（nix-daemon 运行中）
        3. sudo PATH 含 nix（/etc/sudoers.d/99-nix-path）+ /etc/environment 含 nix
           （否则 deploy-rs 激活时 nix-env 找不到）
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - |
        set -euo pipefail
        node="{{.NODE | default "sm-vps-tc"}}"
        echo "==> deploy-rs .#${node} (sm + HM)"
        {{.DEPLOY_RS_CMD}} ".#${node}" -- --impure
      - |
        set -euo pipefail
        node="{{.NODE | default "sm-vps-tc"}}"
        # host/user 从 inventory 推导（N5：不再硬编码；NODE_HOST/NODE_USER 可覆盖）
        host="{{.NODE_HOST | default ""}}"
        user="{{.NODE_USER | default ""}}"
        if [ -z "$host" ]; then
          host="$(nix eval --impure --raw ".#deploy.nodes.${node}.hostname")"
        fi
        if [ -z "$user" ]; then
          user="$(nix eval --impure --raw ".#deploy.nodes.${node}.sshUser")"
        fi
        # 切登录 shell 到 zsh（HM 激活后 zsh 可用；bootstrap 建用户时用 bash）
        # 幂等：已是 zsh 则跳过。见 modules/sm/shells.nix 关于声明化登录 shell 的说明。
        shell_path="/home/${user}/.nix-profile/bin/zsh"
        ssh -o BatchMode=yes -o ConnectTimeout=15 "${user}@${host}" \
          "current=\$(getent passwd ${user} | cut -d: -f7); if [ \"\$current\" != \"${shell_path}\" ]; then sudo -n usermod -s ${shell_path} ${user}; echo \"shell -> zsh\"; else echo \"shell already zsh\"; fi"
      - |
        set -euo pipefail
        node="{{.NODE | default "sm-vps-tc"}}"
        host="{{.NODE_HOST | default ""}}"
        user="{{.NODE_USER | default ""}}"
        if [ -z "$host" ]; then
          host="$(nix eval --impure --raw ".#deploy.nodes.${node}.hostname")"
        fi
        if [ -z "$user" ]; then
          user="$(nix eval --impure --raw ".#deploy.nodes.${node}.sshUser")"
        fi
        # N6：sm 只落地 drop-in（journald/logind/sshd 的 /etc/systemd/*.conf.d、
        # sshd_config.d），运行中的服务不会自动重读——reload/restart 让 drop-in 生效。
        # sshd 用 reload（不中断会话）；journald/logind 用 restart（drop-in 需重启才读）。
        ssh -o BatchMode=yes -o ConnectTimeout=15 "${user}@${host}" \
          'sudo -n systemctl reload ssh 2>/dev/null || true; sudo -n systemctl restart systemd-journald; sudo -n systemctl restart systemd-logind; echo "drop-ins reloaded"'

  smoke:
    desc: "sm-vps 部署后 smoke check（验证 etc/unit/secret/tailnet/SSH）"
    summary: |
      deploy-rs 部署到真机后，SSH 进去验证关键状态是否都绿。

      用法：
        task nix:deploy:smoke NODE=sm-vps-tc

      验证项：
        - SSH 服务 active（确认 sm 没破坏 sshd）
        - sm flag 文件（/etc/sm-vps-managed）node= 正确
        - sm marker unit active
        - HM profile 生效（~/.nix-profile）
        - sops secrets 数量 > 0
        - tailscale 在线
    dir: '{{.USER_WORKING_DIR}}'
    vars:
      NODE: '{{.NODE | default "sm-vps-tc"}}'
    cmds:
      - |
        set -euo pipefail
        node="{{.NODE}}"
        # host/user 从 inventory 推导（N5：不再硬编码；NODE_HOST/NODE_USER 可覆盖）
        host="{{.NODE_HOST | default ""}}"
        user="{{.NODE_USER | default ""}}"
        if [ -z "$host" ]; then
          host="$(nix eval --impure --raw ".#deploy.nodes.${node}.hostname")"
        fi
        if [ -z "$user" ]; then
          user="$(nix eval --impure --raw ".#deploy.nodes.${node}.sshUser")"
        fi
        echo "==> smoke check ${node} (${host})"
        ssh -o BatchMode=yes -o ConnectTimeout=15 "${user}@${host}" 'bash -lc "
          set -euo pipefail
          echo \"[1] SSH: \$(systemctl is-active ssh)\"
          echo \"[2] sm flag: \$(grep node= /etc/sm-vps-managed 2>/dev/null || echo MISSING)\"
          echo \"[3] sm unit: \$(systemctl is-active sm-vps-managed-marker)\"
          echo \"[4] HM: \$(readlink ~/.nix-profile | head -c 30)...\"
          echo \"[5] sops secrets: \$(ls ~/.config/sops-nix/secrets/ 2>/dev/null | wc -l)\"
          echo \"[6] tailscale: \$(sudo -n tailscale status 2>/dev/null | head -1)\"
          echo \"[7] sshd hardened: \$(grep -c PermitRootLogin /etc/ssh/sshd_config.d/99-sm-hardening.conf 2>/dev/null || echo 0)\"
          echo \"[8] mihomo: \$(systemctl is-active mihomo 2>/dev/null || echo disabled)\"
        "'

