---
version: "3"

# hm-only PAs: build the HM generation on the PA itself, then activate.
# Default network: GitHub via the agt mihomo proxy, Nix nars from the USTC
# mirror direct. `-e hm_build_network=exitnode` switches to a temporary
# nixos-vps-dev exit node; `-e hm_build_network=proxy` is the default.
#
# Inventory is generated from flake `deployRoutes`: every node whose
# `deploy.driver` is `ansible-hm` is included automatically. A new
# `hosts/hm/<name>/` node therefore needs no Taskfile or inventory edit.
# The static `inventory/hm.ini` remains as an optional manual override.
#
# The build/activate logic lives in scripts/deploy.nu hm; these tasks are
# thin wrappers so `task nix:hm:apply` and `task nix:deploy:hm` share it.

vars:
  INVENTORY: '{{.INVENTORY | default ""}}'
  SCRIPTS_DIR: "{{.TASKFILE_DIR}}/scripts"

tasks:
  apply:
    desc: "hm PA 本地 build + activate（全部或指定节点；nix:deploy:hm 的底层入口）"
    summary: |
      task nix:hm:apply [NODES=hm-lightvela] [-- <ansible args>]

      NODES 省略时作用于所有 ansible-hm 节点。
      交互式多选入口是 task nix:deploy:hm。
    cmds:
      - |
        nu "{{.SCRIPTS_DIR}}/deploy.nu" hm \
          --nodes "{{.NODES | default ""}}" \
          --inventory "{{.INVENTORY}}" \
          --extra-args "{{.CLI_ARGS}}" {{if .DRY_RUN}}--dry-run{{end}}

  restore:
    desc: "hm PA 平台 reset 后恢复（restore.sh）"
    summary: |
      task nix:hm:restore [NODES=hm-lightvela] [-- <ansible args>]
    cmds:
      - |
        nu "{{.SCRIPTS_DIR}}/deploy.nu" hm \
          --nodes "{{.NODES | default ""}}" \
          --inventory "{{.INVENTORY}}" \
          --tags restore \
          --extra-args "{{.CLI_ARGS}}" {{if .DRY_RUN}}--dry-run{{end}}
