# Optional manual override.
#
# `task nix:hm:*` generates the inventory from flake .#deployRoutes by default,
# so adding a new hosts/hm/<name>/ node needs no edit here. Keep this file only
# for debugging or when INVENTORY=<path> is passed explicitly.
#
# hm-only vendor PAs. Root is the platform-authorized SSH account.
[hm]
hm-lightvela ansible_host=100.72.194.36

[hm:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
