# sm-vps Ansible inventory。
# 每个节点 = 一台非 NixOS 真机。连接默认用 luck + SSH key（bootstrap 完成后）。
# 首次 bootstrap 需要 root + 密码：P0/P2/P4（root 身份）用 --ask-pass 或
# 环境变量 ANSIBLE_PASSWORD 提供 root 密码（见 README）。

[sm_vps]
sm-vps-tc ansible_host=43.156.103.43
sm-vps-hk ansible_host=103.79.184.82 sm_shared=true sm_node=sm-vps-hk

[sm_vps:vars]
# 常规态连接：luck + key（bootstrap 完成后；重跑 --tags bootstrap-p3 也是这个）
ansible_user=luck
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_ssh_common_args=-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=accept-new
# 前提：目标机必须有 python3（Ansible 模块依赖它）。裸 Debian/Ubuntu/RHEL 默认有；
# 若真没有，先用 raw/手动装（playbook 不含 raw 引导）。
ansible_python_interpreter=/usr/bin/python3
