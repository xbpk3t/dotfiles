# sm-vps Ansible inventory。
# 每个节点 = 一台非 NixOS 真机。连接默认用 luck + SSH key（bootstrap 完成后）。
# 首次 bootstrap 需要 root + 密码：bootstrap.yml 的 P1/P3 play 用 --ask-pass 或
# 环境变量 ROOT_PASS 提供 root 密码（见 README）。

[sm_vps]
sm-vps-tc ansible_host=43.156.103.43

[sm_vps:vars]
# 常规态连接：luck + key（bootstrap 完成后；重跑时也是这个）
ansible_user=luck
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_ssh_common_args=-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=accept-new
# 裸 Debian 默认有 python3；若目标机缺 python3，bootstrap.yml 的 P0 会用 raw 装
ansible_python_interpreter=/usr/bin/python3
