# sm-vps 组变量：bootstrap 参数（用户、Nix、age key、tailscale、sshd）。
# HM/sm 收敛走 deploy-rs（不在这里配；驱动版本由 flake.lock 管）。

# 用户
sm_user: luck
sm_uid: 1001
sm_gid: 1001
sm_groups:
  - sudo            # Debian/Ubuntu 管理组；RHEL 系改 wheel（distro 适配点）
sm_shell: /bin/bash

# bootstrap P2a 前置包（distro 适配点：Debian xz-utils vs RHEL xz）
sm_bootstrap_packages:
  - curl
  - ca-certificates
  - xz-utils
  - rsync

# 共享机（共用 VPS）：true 时跳过 sshd 锁、不复制主 age key。
# 按节点在 inventory 覆盖。
sm_shared: false

# 节点（HM/sm 收敛走 deploy-rs，不需要目标机 flake 源码树）
sm_node: sm-vps-tc   # 覆盖：每台机器在 inventory 里设 sm_node=<hostname>

# Nix 安装参数（Determinate installer）
sm_nix_trusted_users: "root {{ sm_user }}"
sm_nix_experimental: "nix-command flakes"

# sops / age key
# 默认 Darwin 的 sops 路径（公钥 age10prwj4… 才是 secrets.yaml 接收方）。
# 注意：若在 Linux 跳板跑 bootstrap，改用 ~/.config/sops/age/keys.txt 或显式 SM_AGE_KEY_SRC。
sm_age_key_src: "{{ lookup('env', 'HOME') }}/Library/Application Support/sops/age/keys.txt"
sm_age_key_dest: "/home/{{ sm_user }}/.config/sops/age/keys.txt"
sm_sys_age_key_dest: /etc/sops/age/keys.txt   # 系统 sops 用（S5）

# sshd 硬化
sm_sshd_dropin: /etc/ssh/sshd_config.d/99-sm-hardening.conf

# tailscale authkey（一次性；可选）。若设置，bootstrap 会 push 到真机并 tailscale up。
# 本地路径（不入库），如 /tmp/ts-authkey-clean。用后真机自动删除。
sm_ts_authkey_src: ""   # 留空则跳过 tailscale up（可后续手动）
