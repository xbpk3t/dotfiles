# sm-vps 真机 bootstrap（Ansible 版）。
# 替代 phase8-real.sh。目标：已有 SSH 的裸 Debian/Ubuntu → luck + Determinate Nix
# + standalone HM + system-manager + tailscale + sops + sshd 硬化。
#
# 用法（在仓库根）：
#   ansible-galaxy collection install -r hosts/sm-vps/ansible/requirements.yml
#   # 首次（需 root 密码）：
#   ansible-playbook -i hosts/sm-vps/ansible/inventory/sm_vps.ini \
#     hosts/sm-vps/ansible/bootstrap.yml --ask-pass
#   # 或 root 密码走环境变量（不交互）：
#   ANSIBLE_PASSWORD='<root密码>' ansible-playbook ... bootstrap.yml
#
# 设计原则（与 phase8 对齐）：
#   - 尽量幂等模块（user/copy/package/authorized_key/synchronize）
#   - 只允许 shell 的步骤：Determinate Nix 安装、HM/sm switch（无官方模块）
#   - 分 play 表达「自锁保护」：P0 建用户 → P1 验证 luck → P4 才锁 sshd
#
# Play 连接身份：
#   P0/P2/P4 = root+密码（ansible_user=root，来自 --ask-pass / ANSIBLE_PASSWORD）
#   P1/P3    = luck+key（inventory 默认连接）
---
- name: "P0  preflight + 建 luck 用户/sudoers/SSH key（root 身份）"
  hosts: sm_vps
  gather_facts: true
  tags: [bootstrap-p0, bootstrap-full]
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ""
  tasks:
    - name: 0a 目标必须是 systemd 发行版（sm 引擎硬前提）
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family in ['Debian', 'RedHat']
        fail_msg: "sm-vps 仅支持 Debian/Ubuntu/RHEL 系（systemd）"
      when: ansible_os_family is defined

    - name: 1a 建用户组（GID 避开常见云厂商预建 UID 1000）
      ansible.builtin.group:
        name: "{{ sm_user }}"
        gid: "{{ sm_gid }}"
        state: present

    - name: 1b 建用户（uid/gid/shell/home）
      ansible.builtin.user:
        name: "{{ sm_user }}"
        uid: "{{ sm_uid }}"
        group: "{{ sm_user }}"
        groups: "{{ sm_groups }}"
        append: true
        shell: "{{ sm_shell }}"
        create_home: true
        state: present

    - name: 1c push Mac 公钥（authorized_keys）
      ansible.posix.authorized_key:
        user: "{{ sm_user }}"
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
        state: present

    - name: 1d NOPASSWD sudo（community.general.sudoers，声明式）
      community.general.sudoers:
        name: "{{ sm_user }}-nopasswd"
        user: "{{ sm_user }}"
        commands: ALL
        runas: ALL
        nopassword: true
        state: present

- name: "P1  验证 luck+key 登录（连接成功即证明；失败整场中止）"
  hosts: sm_vps
  gather_facts: false
  tags: [bootstrap-p1, bootstrap-full]
  tasks:
    - name: 1e luck 能登录（能跑 task = key auth 通过）
      ansible.builtin.command: id
      register: luck_id
      changed_when: false
    - name: 1f NOPASSWD sudo 生效
      ansible.builtin.command: sudo -n true
      changed_when: false

- name: "P2  装 Determinate Nix + age key + linger + bus 等待（root 身份）"
  hosts: sm_vps
  gather_facts: true
  tags: [bootstrap-p2, bootstrap-full]
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ""
  tasks:
    - name: 2a 安装前置包（curl/ca-certificates/xz/rsync；package 跨发行版）
      ansible.builtin.package:
        name:
          - curl
          - ca-certificates
          - xz-utils
          - rsync
        state: present

    - name: 2b 下载 Determinate Nix 安装器
      ansible.builtin.get_url:
        url: https://install.determinate.systems/nix
        dest: /tmp/nix-installer.sh
        mode: "0755"

    - name: 2c 安装 Determinate Nix（幂等：已装则跳过）
      ansible.builtin.command:
        cmd: "sh /tmp/nix-installer.sh install --no-confirm --extra-conf 'trusted-users = {{ sm_nix_trusted_users }}' --extra-conf 'experimental-features = {{ sm_nix_experimental }}'"
        creates: /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
      register: nix_install

    # HM/sm 收敛走 deploy-rs（remote_build，不需目标机 flake 源码）。
    # 因此不再 rsync flake 到目标机（与「删远端树 + deploy-rs 唯一入口」一致）。

    - name: 2f 用户 age key 目录
      ansible.builtin.file:
        path: "{{ sm_age_key_dest | dirname }}"
        owner: "{{ sm_user }}"
        group: "{{ sm_user }}"
        mode: "0700"
        state: directory

    - name: 2g push 用户 age key（HM sops）
      ansible.builtin.copy:
        src: "{{ sm_age_key_src }}"
        dest: "{{ sm_age_key_dest }}"
        owner: "{{ sm_user }}"
        group: "{{ sm_user }}"
        mode: "0600"

    - name: 2h 系统 age key 目录（系统 sops S5）
      ansible.builtin.file:
        path: "{{ sm_sys_age_key_dest | dirname }}"
        owner: root
        group: root
        mode: "0700"
        state: directory

    - name: 2i push 系统 age key
      ansible.builtin.copy:
        src: "{{ sm_age_key_src }}"
        dest: "{{ sm_sys_age_key_dest }}"
        owner: root
        group: root
        mode: "0600"

    - name: 2j enable-linger（用户 systemd；无原生模块，用 shell + 幂等）
      ansible.builtin.command:
        cmd: "loginctl enable-linger {{ sm_user }}"
        creates: "/var/lib/systemd/linger/{{ sm_user }}"
      register: linger_out

    - name: 2k 拉起用户 systemd 实例
      ansible.builtin.systemd:
        name: "user@{{ sm_uid }}.service"
        state: started

    - name: 2l 等用户 DBus socket（HM activation 的 user unit 依赖它）
      ansible.builtin.wait_for:
        path: "/run/user/{{ sm_uid }}/bus"
        state: present
        timeout: 15

    - name: 2m push tailscale authkey（若提供；去换行，用后真机删除）
      ansible.builtin.copy:
        src: "{{ sm_ts_authkey_src }}"
        dest: /root/.ts-authkey
        mode: "0600"
      when: sm_ts_authkey_src | length > 0
      register: ts_authkey_pushed

- name: "P3  tailscale（luck 身份；HM/sm/sops 走 deploy-rs）"
  hosts: sm_vps
  gather_facts: true   # 3c/4b 用 ansible_distribution/ansible_os_family，必须 gather
  tags: [bootstrap-p3]
  environment:
    HOME: "/home/{{ sm_user }}"
    USER: "{{ sm_user }}"
    XDG_RUNTIME_DIR: "/run/user/{{ sm_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ sm_uid }}/bus"
    HOME_MANAGER_BACKUP_EXT: "{{ sm_hm_backup_ext }}"
  tasks:
    # HM/system-manager 收敛不在这里做——它需要远端 flake 树（已删），
    # 且 deploy-rs remote_build 是唯一正确入口（S3 打通，不依赖远端树）。
    # bootstrap 完成后首次激活：task nix:deploy:sm NODE={{ sm_node }}
    - name: 3a 提示 HM/sm 首次激活走 deploy-rs（非阻塞）
      ansible.builtin.debug:
        msg: "bootstrap 完成。HM/system-manager 激活走 deploy-rs: task nix:deploy:sm NODE={{ sm_node }}"

    - name: 3c tailscale 官方 repo 添加（幂等；deb822 格式）
      ansible.builtin.deb822_repository:
        name: tailscale
        types: [deb]
        uris: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}"
        suites: "{{ ansible_distribution_release }}"
        components: [main]
        signed_by: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.gpg"
        state: present
      when: ansible_os_family == 'Debian'
      become: true

    - name: 3d 安装 tailscale 包
      ansible.builtin.package:
        name: tailscale
        state: present
      become: true

    - name: 3e0 检查 tailscale 状态文件（决定是否要 up；state 是 root 属主）
      ansible.builtin.stat:
        path: /var/lib/tailscale/tailscaled.state
      register: tailscaled_state
      become: true

    - name: 3e tailscale up（仅当已 push authkey 且未登录；用后删文件）
      ansible.builtin.command:
        cmd: "tailscale up --authkey=file:/root/.ts-authkey && rm -f /root/.ts-authkey"
      become: true
      when:
        - sm_ts_authkey_src | length > 0
        - not tailscaled_state.stat.exists

    # sops secrets 由 HM 的 sops 模块在 deploy-rs 激活时生成（bootstrap 阶段还没有）。
    # 验证走 deploy-rs 后的 smoke：task nix:deploy:smoke NODE={{ sm_node }}
    - name: 3f 提示 sops 验证走 deploy-rs smoke（非阻塞）
      ansible.builtin.debug:
        msg: "sops 验证走 deploy-rs smoke: task nix:deploy:smoke NODE={{ sm_node }}"

- name: "P4  锁 sshd（root 身份；仅在 luck 已验证后）"
  hosts: sm_vps
  gather_facts: true
  tags: [bootstrap-p4, bootstrap-full]
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ""
  tasks:
    - name: 4a sshd 硬化 drop-in（copy + validate）
      ansible.builtin.copy:
        dest: "{{ sm_sshd_dropin }}"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
        mode: "0644"
        validate: "sshd -t -f %s"

    - name: 4b 重载 sshd（服务名随发行版）
      ansible.builtin.systemd:
        name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
        state: reloaded
      register: sshd_reload

    - name: 4c 锁后回归验证（luck 仍可登录；用 ansible_host 而非 inventory 名，且 accept-new）
      ansible.builtin.command: ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "{{ sm_user }}@{{ ansible_host }}" "id"
      delegate_to: localhost
      register: post_lock
      changed_when: false
