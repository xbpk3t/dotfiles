name: flake-check

on:
  pull_request:
  push:
    branches:
      - main
  # workflow_dispatch:

concurrency:
  # 避免同一分支上的旧任务继续占用 runner。
  group: flake-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Run flake checks
        # CI 跑在 ubuntu (x86_64-linux)，能原生构建本仓库所有 x86_64-linux 的 check
        # （host-eval 用 builtins.seq 剥离 store context，只走求值契约；libChecks 是全逻辑回归）。
        # 曾误判为「上游漂移」而改用只跑 checks；实测旧 lock 下 flake check 对 x86_64-linux
        # 完全健康（nix flake check --no-build exit 0），本地 darwin 无法构建是缺 linux
        # builder 的环境限制，非仓库问题。故恢复标准 `nix flake check`。
        run: nix flake check --accept-flake-config
