name: flake-check

on:
  pull_request:
  push:
    branches:
      - main
  # workflow_dispatch:

concurrency:
  # 避免同一分支上的旧任务继续占用 runner。
  group: flake-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Run flake checks
        # CI 跑在 ubuntu (x86_64-linux)，能原生构建本仓库所有 x86_64-linux 的 check
        # （host-eval 用 builtins.seq 剥离 store context，只走求值契约；libChecks 是全逻辑回归）。
        # 曾误判为「上游漂移」而改用只跑 checks；实测旧 lock 下 flake check 对 x86_64-linux
        # 完全健康（nix flake check --no-build exit 0），本地 darwin 无法构建是缺 linux
        # builder 的环境限制，非仓库问题。故恢复标准 `nix flake check`。
        run: nix flake check --accept-flake-config

      - name: Check flake.lock health
        # flake-checker：只读检查三个 nixpkgs 输入的锁文件健康（非阻断，默认 exit 0）。
        # condition 覆盖 check-* 三项：
        #   - 新鲜度 <45 天（与 update-flake-lock 月度刷新节奏对齐）
        #   - owner 大小写不敏感（lock 里 NixOS / nixos 混用，`owner == 'NixOS'` 会误报小写输入）
        # 刻意不用 supportedRefs.contains()：释放版二进制的 supportedRefs 运行时行为不可靠，
        #   在本仓会让三个输入全部误报违规；纯新鲜度 + owner 校验更稳。
        # send-statistics: false 关闭遥测。
        uses: DeterminateSystems/flake-checker-action@main
        with:
          nixpkgs-keys: nixpkgs,nixpkgs-darwin,nixpkgs-stable
          condition: "numDaysOld < 45 && (owner == 'NixOS' || owner == 'nixos')"
          send-statistics: false
